{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TaskFlow{% endblock %} · TaskFlow</title>
  <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">Task<span>Flow</span></div>
    <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">Dashboard</a>
    <a class="nav-link {% if page == 'projects' %}active{% endif %}" href="{% url 'projects' %}">Projects</a>
    <a class="nav-link {% if page == 'tasks' %}active{% endif %}" href="{% url 'tasks' %}">Tasks</a>
    <a class="nav-link {% if page == 'team' %}active{% endif %}" href="{% url 'team' %}">Team</a>
    <div class="sidebar-foot">Front-end demo · sample data</div>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
